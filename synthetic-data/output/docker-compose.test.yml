# docker-compose.test.yml — MySQL test override for synthetic data seeding.
# Extends the main docker-compose.yml. Exposes MySQL on host port 3307 (avoids
# conflicts if port 3306 is taken), and mounts seed-all.sql as an init script.
#
# Usage (from train-ticket-aitest/):
#   docker compose -f docker-compose.yml -f synthetic-data/output/docker-compose.test.yml up -d
#
# Then run:
#   mysql -h127.0.0.1 -P3307 -uroot -p'admin@123#' < synthetic-data/output/seed-all.sql
#   GATEWAY=http://localhost:8888 bash synthetic-data/output/setup-auth.sh

services:
  mysql:
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "admin@123#"
      MYSQL_USER: test
      MYSQL_PASSWORD: "test@123#"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin@123#"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
